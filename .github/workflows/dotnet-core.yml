name: .NET Core

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nuget-release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
      checks: write
      id-token: write
    outputs:
      version: ${{ steps.release-notes.outputs.version }}

    steps:
    - uses: actions/checkout@v7
    - name: Validate release notes
      id: release-notes
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        [xml]$props = Get-Content Directory.Build.props
        $version = $props.SelectSingleNode('/Project/PropertyGroup/Version').InnerText.Trim()
        if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "Invalid package version: $version" }
        $notes = "docs/releases/$version.md"
        if (!(Test-Path -LiteralPath $notes) -or [string]::IsNullOrWhiteSpace((Get-Content -LiteralPath $notes -Raw))) {
          throw "Write release notes in $notes before publishing."
        }
        "version=$version" >> $env:GITHUB_OUTPUT
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          8.0.x
          10.0.x
    - name: Install dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --configuration Release --no-restore -p:ContinuousIntegrationBuild=true
    - name: Unit tests
      run: dotnet test test/Crypto.Websocket.Extensions.Tests/Crypto.Websocket.Extensions.Tests.csproj --configuration Release --no-build --logger "trx;LogFilePrefix=unit"
    - name: Debug unit tests (includes buffering and timing coverage)
      run: dotnet test test/Crypto.Websocket.Extensions.Tests/Crypto.Websocket.Extensions.Tests.csproj --configuration Debug --no-restore -p:TestTfmsInParallel=false --logger "trx;LogFilePrefix=debug"
    - name: Recorded-message integration tests
      run: dotnet test test_integration/Crypto.Websocket.Extensions.Tests.Integration/Crypto.Websocket.Extensions.Tests.Integration.csproj --configuration Release --no-build --filter "FullyQualifiedName~StreamingRecordedMessages_ShouldHandleOrderBookCorrectly" --logger "trx;LogFilePrefix=integration"
    - name: Test Report
      uses: dorny/test-reporter@v3
      if: success() || failure()
      with:
        name: tests
        path: '**/*.trx'
        reporter: dotnet-trx
    - name: Pack core library
      run: dotnet pack src/Crypto.Websocket.Extensions.Core/Crypto.Websocket.Extensions.Core.csproj --no-build --configuration Release -p:ContinuousIntegrationBuild=true --include-symbols -p:SymbolPackageFormat=snupkg -o artifacts
    - name: Pack exchange library
      run: dotnet pack src/Crypto.Websocket.Extensions/Crypto.Websocket.Extensions.csproj --no-build --configuration Release -p:ContinuousIntegrationBuild=true --include-symbols -p:SymbolPackageFormat=snupkg -o artifacts
    - name: Check existing package ownership before publishing
      shell: pwsh
      env:
        PACKAGE_VERSION: ${{ steps.release-notes.outputs.version }}
      run: |
        $ErrorActionPreference = 'Stop'
        # Check both IDs before either upload to avoid mixing release commits
        # when recovering a partially published version.
        foreach ($packageId in @('Crypto.Websocket.Extensions.Core', 'Crypto.Websocket.Extensions')) {
          $lowerId = $packageId.ToLowerInvariant()
          $packagePath = Join-Path $env:RUNNER_TEMP "$packageId.existing.nupkg"
          $packageUrl = "https://api.nuget.org/v3-flatcontainer/$lowerId/$env:PACKAGE_VERSION/$lowerId.$env:PACKAGE_VERSION.nupkg"
          try {
            Invoke-WebRequest -Uri $packageUrl -OutFile $packagePath
          } catch {
            if ($_.Exception.Response.StatusCode -eq 404) { continue }
            throw
          }
          $archive = [System.IO.Compression.ZipFile]::OpenRead($packagePath)
          try {
            $entry = $archive.GetEntry("$packageId.nuspec")
            if (!$entry) { throw "Missing package manifest for $packageId." }
            $reader = [System.IO.StreamReader]::new($entry.Open())
            try { [xml]$nuspec = $reader.ReadToEnd() } finally { $reader.Dispose() }
          } finally { $archive.Dispose() }
          $packageCommit = $nuspec.SelectSingleNode('/*[local-name()="package"]/*[local-name()="metadata"]/*[local-name()="repository"]/@commit').Value
          if ($packageCommit -ne $env:GITHUB_SHA) {
            throw "$packageId $env:PACKAGE_VERSION already belongs to $packageCommit. Bump the version or rerun that original commit."
          }
        }
    - name: NuGet login (OIDC)
      uses: NuGet/login@v1
      id: nuget-login
      with:
        user: marfusios
    - name: Publish libraries (NuGet)
      shell: pwsh
      env:
        NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        PACKAGE_VERSION: ${{ steps.release-notes.outputs.version }}
      run: |
        $ErrorActionPreference = 'Stop'
        foreach ($packageId in @('Crypto.Websocket.Extensions.Core', 'Crypto.Websocket.Extensions')) {
          dotnet nuget push "artifacts/$packageId.$env:PACKAGE_VERSION.nupkg" --api-key $env:NUGET_API_KEY --source 'https://api.nuget.org/v3/index.json' --skip-duplicate
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish $packageId." }
          # Wait for each upload (including skipped duplicates) to become public
          # and verify its commit before uploading the next package.
          $lowerId = $packageId.ToLowerInvariant()
          $packagePath = Join-Path $env:RUNNER_TEMP "$packageId.published.nupkg"
          $packageUrl = "https://api.nuget.org/v3-flatcontainer/$lowerId/$env:PACKAGE_VERSION/$lowerId.$env:PACKAGE_VERSION.nupkg"
          for ($attempt = 1; $attempt -le 60; $attempt++) {
            try {
              Invoke-WebRequest -Uri $packageUrl -OutFile $packagePath
              break
            } catch {
              if ($attempt -eq 60) { throw }
              Write-Host "Waiting for $packageId on NuGet ($attempt/60)."
              Start-Sleep -Seconds 15
            }
          }
          $archive = [System.IO.Compression.ZipFile]::OpenRead($packagePath)
          try {
            $entry = $archive.GetEntry("$packageId.nuspec")
            if (!$entry) { throw "Missing package manifest for $packageId." }
            $reader = [System.IO.StreamReader]::new($entry.Open())
            try { [xml]$nuspec = $reader.ReadToEnd() } finally { $reader.Dispose() }
          } finally { $archive.Dispose() }
          $packageCommit = $nuspec.SelectSingleNode('/*[local-name()="package"]/*[local-name()="metadata"]/*[local-name()="repository"]/@commit').Value
          if ($packageCommit -ne $env:GITHUB_SHA) {
            throw "$packageId $env:PACKAGE_VERSION belongs to $packageCommit. No further packages will be uploaded."
          }
        }

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
    - name: Publish GitHub release notes
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
        PACKAGE_VERSION: ${{ needs.build.outputs.version }}
      run: |
        $ErrorActionPreference = 'Stop'
        $tag = "v$env:PACKAGE_VERSION"
        gh release view $tag --json tagName --jq .tagName 2>$null
        $releaseExists = $LASTEXITCODE -eq 0

        # NuGet processes uploads asynchronously. Verify both packages, including
        # recovery after duplicate uploads, before creating the release tag.
        foreach ($packageId in @('Crypto.Websocket.Extensions.Core', 'Crypto.Websocket.Extensions')) {
          $lowerId = $packageId.ToLowerInvariant()
          $packagePath = Join-Path $env:RUNNER_TEMP "$packageId.$env:PACKAGE_VERSION.nupkg"
          $packageUrl = "https://api.nuget.org/v3-flatcontainer/$lowerId/$env:PACKAGE_VERSION/$lowerId.$env:PACKAGE_VERSION.nupkg"
          for ($attempt = 1; $attempt -le 60; $attempt++) {
            try {
              Invoke-WebRequest -Uri $packageUrl -OutFile $packagePath
              break
            } catch {
              if ($attempt -eq 60) { throw }
              Write-Host "Waiting for $packageId on NuGet ($attempt/60)."
              Start-Sleep -Seconds 15
            }
          }
          $archive = [System.IO.Compression.ZipFile]::OpenRead($packagePath)
          try {
            $entry = $archive.GetEntry("$packageId.nuspec")
            if (!$entry) { throw "Missing package manifest for $packageId." }
            $reader = [System.IO.StreamReader]::new($entry.Open())
            try { [xml]$nuspec = $reader.ReadToEnd() } finally { $reader.Dispose() }
          } finally { $archive.Dispose() }
          $packageCommit = $nuspec.SelectSingleNode('/*[local-name()="package"]/*[local-name()="metadata"]/*[local-name()="repository"]/@commit').Value
          if ($packageCommit -ne $env:GITHUB_SHA) {
            throw "$packageId $env:PACKAGE_VERSION belongs to commit $packageCommit, not $env:GITHUB_SHA. Bump the version or rerun the original release commit."
          }
        }

        $tagRefs = @(git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}")
        if ($LASTEXITCODE -ne 0) { throw 'Unable to verify the release tag.' }
        $tagRef = $tagRefs | Where-Object { $_.EndsWith('^{}') } | Select-Object -First 1
        if (!$tagRef) { $tagRef = $tagRefs | Select-Object -First 1 }
        if ($tagRef -and (($tagRef -split '\s+')[0] -ne $env:GITHUB_SHA)) {
          throw "Existing tag $tag does not match the published packages' commit."
        }
        if (!$releaseExists) {
          gh release create $tag --target $env:GITHUB_SHA --title "Crypto.Websocket.Extensions $env:PACKAGE_VERSION" --notes-file "docs/releases/$env:PACKAGE_VERSION.md"
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }
        }
